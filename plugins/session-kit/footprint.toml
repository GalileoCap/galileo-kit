# This plugin's reach as `claude plugin validate` reports it, held by
# `session-codeintel footprint`. [validator] is what the engine printed,
# written by --write and compared as counts. [why] gives the reason for each
# $ member and each hook event, and a new one waits on its reason.

engine = "2.1.308"

[validator]
"./kit.tsx calls" = [
  "$.clock.after (via handoffThenClear, holdColdTimer, stepChain, stepOffer)",
  "$.clock.now",
  "$.command.run (via clearThenResend, compactByCommand, runHandoff, runHandoffBeforeClear)",
  "$.env.get",
  "$.fs.exists (via handoffState)",
  "$.fs.read (via indexOf, journalLine, ownerTask, past, projectRunners, writeFacts)",
  "$.fs.stat (via handoffState)",
  "$.fs.write",
  "$.model.complete (via judgeChain)",
  "$.process.run (via gitOutput, lastCommitMs, uncommitted)",
  "$.prompt.submit (via afterCompaction, resend)",
  "$.session.cwd",
  "$.session.id",
  "$.session.messages (via opensFreshContext)",
  "$.session.surfaces (via moment)",
  "$.session.turns (via opensFreshContext)",
  "$.session.usage",
  "$.state.get",
  "$.state.set",
  "$.tool.register",
  "$.ui.log",
  "$.ui.resolve",
  "$.ui.toast (via clearThenResend, compactByCommand, moment, resend, runHandoff, runHandoffBeforeClear)",
]
"./kit.tsx env reads" = [
  "HOME",
  "TMPDIR",
]
"./kit.tsx env writes" = [
]
"./kit.tsx gating hook with .catch" = [
