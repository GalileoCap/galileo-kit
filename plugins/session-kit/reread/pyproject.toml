[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-reread"
version = "0.1.0a0"
description = "Which sections of the Markdown files a session changed to read again, and how"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4.3.0",
]

[project.scripts]
session-reread = "session_reread.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.32.2",
    "pytest>=9.0.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/session_reread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
extend = "ruff.base.toml"

[tool.ruff.lint]
# This project's own exceptions to the bar, each with its reason. They add to
# ruff.base.toml's, as `extend-select` and `extend-per-file-ignores` do.
ignore = []
