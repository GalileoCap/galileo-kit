[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-tells"
version = "0.1.0"
description = "The tells of machine-written prose, found in Markdown, Python, TypeScript and Rust"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4",
    "tree-sitter>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
session-tells = "session_tells.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.32.2",
    "pytest>=9.0.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/session_tells"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
extend = "ruff.base.toml"

[tool.ruff.lint]
# This package's own exceptions to the bar, each with its reason. They add to
# ruff.base.toml's, as `extend-select` and `extend-per-file-ignores` do.
ignore = []
