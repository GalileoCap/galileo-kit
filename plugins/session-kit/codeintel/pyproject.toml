[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-codeintel"
version = "0.7.0"
description = "Structural search and rewrite recipes, pinned code-intelligence tools, a looks check for a frontend, the layers pack that holds a pure core, a code measure, the duplicate, fallback and file-length gates, a footprint gate over a plugin's reach, the quality bar as a template, and a pyright environment for multi-package repositories"
readme = "docs/README.md"
requires-python = ">=3.12"
# The tools are the point of the package: run through it, they are the
# versions it resolves, whatever is on PATH. ruff is here for the measure's
# complexity figure (C901), the same for every machine.
dependencies = [
    "ast-grep-cli>=0.45.3,<0.46",
    "import-linter>=2.15,<3",
    "ruff>=0.15.7,<0.16",
]

[project.scripts]
session-codeintel = "session_codeintel.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.32.2",
    "pytest>=9.0.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/session_codeintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
extend = "ruff.base.toml"

[tool.ruff.lint]
# This package's own exceptions to the bar, each with its reason. They add to
# ruff.base.toml's, as `extend-select` and `extend-per-file-ignores` do.
ignore = []
