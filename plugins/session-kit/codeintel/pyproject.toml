[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-codeintel"
version = "0.4.0"
description = "Structural search and rewrite recipes, pinned code-intelligence tools, a looks check for a frontend, the layers pack that holds a pure core, and a pyright environment for multi-package repositories"
readme = "docs/README.md"
requires-python = ">=3.12"
# The two tools are the point of the package: run through it, they are the
# versions it resolves, whatever is on PATH.
dependencies = [
    "ast-grep-cli>=0.45.3,<0.46",
    "import-linter>=2.15,<3",
]

[project.scripts]
session-codeintel = "session_codeintel.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.32.2",
    "pytest>=9.0.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/session_codeintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
# The owner's bar, as abstract-template writes it for their other projects.
ignore = [
    "D203",    # one-blank-line-before-class: D211 is kept, and ruff warns on the pair
    "D213",    # multi-line-summary-second-line: D212 is kept, likewise
    "COM812",  # missing-trailing-comma: conflicts with the formatter
    "CPY001",  # per-file copyright headers: licensing lives in LICENSE
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 35
max-branches = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert: the point of a test
    "PLR2004", # magic value in comparison: the expected value is the assertion
]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
