# This plugin's reach as `claude plugin validate` reports it, held by
# `session-codeintel footprint`. [validator] is what the engine printed,
# written by --write and compared as counts. [why] gives the reason for each
# $ member and each hook event, and a new one waits on its reason.

engine = "2.1.308"

[validator]
"./read_aloud.tsx calls" = [
  "$.clock.after (via startReading)",
  "$.command.register",
  "$.process.spawn (via say)",
  "$.state.get",
  "$.state.set",
  "$.ui.resolve",
  "$.ui.toast (via readAloud)",
]
"./read_aloud.tsx gating hook with .catch" = [
  "command.run{command=read-aloud}",
]
"./read_aloud.tsx hooks" = [
  "command.run{command=read-aloud}",
  "session.start",
  "turn.complete",
  "ui.render{component=AbovePrompt}",
]
"./read_aloud.tsx state reads" = [
  "read-aloud.answer",
  "read-aloud.isAuto",
  "read-aloud.isSpeaking",
]
"./read_aloud.tsx state writes" = [
  "read-aloud.answer",
  "read-aloud.isAuto",
  "read-aloud.isSpeaking",
]
"types ./types/index.d.ts declares on $" = [
]
"types ./types/index.d.ts declares state" = [
  "read-aloud.answer",
  "read-aloud.isAuto",
  "read-aloud.isSpeaking",
]

[why]
"$.clock.after" = "Starts a reading once the hook or press that asked for it has returned, so no turn's end waits on the voice."
"$.command.register" = "The /read-aloud command."
"$.process.spawn" = "Runs /usr/bin/say for each paragraph, the text on its input, in the voice the option names; closing the stream kills it, so a stop is immediate."
"$.state.get" = "The plugin's own state under read-aloud.*, declared in types/index.d.ts."
"$.state.set" = "The plugin's own state under read-aloud.*, declared in types/index.d.ts."
"$.ui.resolve" = "The components the row above the prompt is drawn with."
"$.ui.toast" = "Says why the speech failed, a voice that is not installed or no synthesizer."
"command.run" = "Answers /read-aloud: read the last answer or stop, stop, auto on or off."
"session.start" = "Registers the command."
"turn.complete" = "Keeps the main session's final answer, and reads it as the turn ends when auto-read is on."
"ui.render" = "The row above the prompt with the read or stop button and the auto-read switch, drawn above the bands beneath."
